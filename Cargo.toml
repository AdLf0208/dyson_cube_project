[package]
# Ported from: Dyson Cube Project 1.0.5 (InnovativeOnlineIndustries/Dyson-Cube-Project,
# MIT), Minecraft Java 1.21.1 NeoForge. Clean-room Rust rewrite from the upstream
# behaviour and the mod's own data files. Local-only until the maintainer approves
# publishing (ARCHITECTURE.md §8).
name = "horizon-dysoncubeproject"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Dyson Cube Project for Horizon, slice 1: the ray receiver and its multiblock"

[dependencies]
# The pinned SDK's API crate, fetched into .horizon/sdk/ by any `cargo horizon-mod` command (the
# launcher builds against its own copy of the same build). Any other registry dependency must be
# pinned with `horizon-launcher native-lock .` before building.
horizon-mod-api = { path = ".horizon/sdk/api/crates/horizon-mod-api" }
